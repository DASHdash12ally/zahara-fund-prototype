services:
  - type: web
    name: zahara-fund
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PAYMENT_CURRENCY
        value: UGX
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_WEBHOOK_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
