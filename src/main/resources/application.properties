server.port=${PORT:8080}
spring.application.name=zahara-fund
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/zahara-fund;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.currency=${PAYMENT_CURRENCY:UGX}
app.frontend-url=${APP_BASE_URL:http://localhost:8080}
flutterwave.secret-key=${FLW_SECRET_KEY:}
flutterwave.webhook-secret=${FLW_WEBHOOK_SECRET:}
