<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donation status — HopeBridge</title><link rel="stylesheet" href="/styles.css"></head>
<body><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section style="background:white;padding:38px;max-width:520px;width:100%;border-radius:8px;text-align:center"><a class="brand" href="/" style="justify-content:center"><span class="brand-mark">H</span> hopebridge<span class="brand-dot">.</span></a><h1 id="title" style="font:800 30px Manrope;margin:28px 0 10px">Checking your donation…</h1><p id="message" style="color:#718078;font-size:13px;line-height:1.7">Please wait while we verify the payment with the provider.</p><p id="reference" style="font-size:11px;color:#718078"></p><a href="/" class="primary-btn" style="margin-top:20px">Return to website →</a></section></main>
<script>
(async()=>{const q=new URLSearchParams(location.search);const id=q.get("transaction_id"),ref=q.get("tx_ref");const title=document.getElementById("title"),msg=document.getElementById("message"),refEl=document.getElementById("reference");if(q.get("status")==="cancelled"){title.textContent="Payment cancelled";msg.textContent="No successful payment has been confirmed. You can return and try again.";return;}if(!id||!ref){title.textContent="Payment not confirmed";msg.textContent="We did not receive the information needed to verify this payment.";return;}try{const r=await fetch("/api/verify?transaction_id="+encodeURIComponent(id)+"&tx_ref="+encodeURIComponent(ref));const d=await r.json();title.textContent=d.status==="SUCCESS"?"Thank you for giving!":"Payment not confirmed";msg.textContent=d.message;refEl.textContent="Reference: "+ref;}catch(e){title.textContent="Verification pending";msg.textContent="We could not verify the payment right now. Please contact the organisation with your transaction reference.";refEl.textContent="Reference: "+ref;}})();
</script></body></html>
